server:
  port: ${PORT:8084}          # Render asigna PORT automaticamente

spring:
  application:
    name: comprobantes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/comprobantes_db}
    username: ${DB_USER:comprobantes_user}
    password: ${DB_PASSWORD:comprobantes_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}   # Neon free: pocas conexiones por servicio
      minimum-idle: 1
      connection-timeout: 30000             # Neon puede tardar unos segundos en "despertar"
      idle-timeout: 120000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    # Local: amqp://usuario:clave@localhost:5672  |  CloudAMQP: amqps://usuario:clave@host/vhost (TLS automatico)
    addresses: ${RABBIT_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 3
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

comprobante:
  serie: B001
  empresa: ${EMPRESA_NOMBRE:Academia de Cursos S.A.C.}
  ruc: ${EMPRESA_RUC:20000000001}
  direccion: ${EMPRESA_DIRECCION:Av. Ejemplo 123, Lima}
  max-intentos: 5

seguridad:
  jwt:
    secreto: ${JWT_SECRET}
    emisor: plataforma-cursos
  clave-interna: ${INTERNAL_API_KEY}

correo:
  proveedor: ${CORREO_PROVEEDOR:smtp}      # smtp (local) | brevo (Render free bloquea SMTP)
  remitente: ${MAIL_FROM:Academia <no-responder@academia.pe>}
  brevo-api-key: ${BREVO_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness (Render) y /readiness
      show-components: always # el gateway muestra db / rabbit en "Estado del sistema"
  health:
    mail:
      enabled: false
