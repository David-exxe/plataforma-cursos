server:
  port: 8084

spring:
  application:
    name: comprobantes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/comprobantes_db}
    username: ${DB_USER:comprobantes_user}
    password: ${DB_PASSWORD:comprobantes_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 3
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

comprobante:
  serie: B001
  empresa: ${EMPRESA_NOMBRE:Academia de Cursos S.A.C.}
  ruc: ${EMPRESA_RUC:20000000001}
  direccion: ${EMPRESA_DIRECCION:Av. Ejemplo 123, Lima}
  remitente: ${MAIL_FROM:Academia <no-responder@academia.pe>}
  max-intentos: 5

seguridad:
  jwt:
    secreto: ${JWT_SECRET}
    emisor: plataforma-cursos
  clave-interna: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
