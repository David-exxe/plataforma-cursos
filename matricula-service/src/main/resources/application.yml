server:
  port: 8081

spring:
  application:
    name: matricula-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matricula_db}
    username: ${DB_USER:matricula_user}
    password: ${DB_PASSWORD:matricula_pass}
  jpa:
    hibernate:
      ddl-auto: none          # el esquema lo maneja Flyway (scripts en db/migration)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: simple
    listener:
      simple:
        default-requeue-rejected: false   # agotados los reintentos -> Dead Letter Queue
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 3
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

app:
  zona-horaria: America/Lima
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  correo-remitente: ${MAIL_FROM:Academia <no-responder@academia.pe>}
  admin:
    email: ${ADMIN_EMAIL:admin@academia.pe}
    password: ${ADMIN_PASSWORD:}          # si esta vacio no se crea el admin
    telefono: ${ADMIN_TELEFONO:51999999999}
  pagos-url: ${PAGOS_URL:http://localhost:8082}
  inscripcion-horas-vencimiento: 72

seguridad:
  jwt:
    secreto: ${JWT_SECRET}
    emisor: plataforma-cursos
    minutos-expiracion: 60
    minutos-expiracion-2fa: 5
  clave-interna: ${INTERNAL_API_KEY}
  clave-cifrado: ${ENCRYPTION_KEY}        # Base64 de 32 bytes, cifra los secretos TOTP
  max-intentos-login: 5
  minutos-bloqueo-cuenta: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
