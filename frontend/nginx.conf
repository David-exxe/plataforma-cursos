server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos con hash en el nombre se pueden cachear para siempre
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de Angular (/cursos/3, /pago/resultado...): siempre devuelven index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
